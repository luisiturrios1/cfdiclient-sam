AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: |
  cfdiclient-sam
  Sample SAM Template for cfdiclient-sam
Globals:
  Function:
    Tracing: Active
    Environment:
      Variables:
        POWERTOOLS_LOG_LEVEL: INFO
Resources:
  EmpresaDBTable:
    Type: AWS::DynamoDB::Table
    Properties:
      AttributeDefinitions:
        - AttributeName: rfc
          AttributeType: S
      KeySchema:
        - AttributeName: rfc
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST
  DocumentosDBTable:
    Type: AWS::DynamoDB::Table
    Properties:
      AttributeDefinitions:
        - AttributeName: UUID
          AttributeType: S
        - AttributeName: Fecha
          AttributeType: S
        - AttributeName: RfcEmisor
          AttributeType: S
        - AttributeName: RfcReceptor
          AttributeType: S
      KeySchema:
        - AttributeName: UUID
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: FechaIndex
          KeySchema:
            - AttributeName: Fecha
              KeyType: HASH
          Projection:
            ProjectionType: KEYS_ONLY
        - IndexName: RfcEmisorIndex
          KeySchema:
            - AttributeName: RfcEmisor
              KeyType: HASH
          Projection:
            ProjectionType: KEYS_ONLY
        - IndexName: RfcReceptorIndex
          KeySchema:
            - AttributeName: RfcReceptor
              KeyType: HASH
          Projection:
            ProjectionType: KEYS_ONLY
      BillingMode: PAY_PER_REQUEST
  FirmasBucket:
    Type: AWS::S3::Bucket
    Properties:
      AccessControl: Private
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
  DescargasBucket:
    Type: AWS::S3::Bucket
    Properties:
      AccessControl: Private
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
  DocumentosBucket:
    Type: AWS::S3::Bucket
    Properties:
      AccessControl: Private
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
  DescompresorFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/descompresor/
      Handler: app.lambda_handler
      Runtime: python3.9
      Timeout: 30
      Architectures:
        - x86_64
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref DocumentosBucket
        - S3ReadPolicy:
            BucketName: '*'
      Environment:
        Variables:
          POWERTOOLS_SERVICE_NAME: descompresor
          DOCUMENTOS_BUCKET_NAME: !Ref DocumentosBucket
      Events:
        BucketEvent1:
          Type: S3
          Properties:
            Bucket: !Ref DescargasBucket
            Events:
              - s3:ObjectCreated:*
            Filter:
              S3Key:
                Rules:
                  - Name: suffix
                    Value: zip
  ExtractorFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/extractor/
      Handler: app.lambda_handler
      Runtime: python3.9
      Timeout: 30
      Architectures:
        - x86_64
      Policies:
        - DynamoDBWritePolicy:
            TableName: !Ref DocumentosDBTable
        - S3ReadPolicy:
            BucketName: '*'
      Environment:
        Variables:
          DOCUMENTOS_TABLE_NAME: !Ref DocumentosDBTable
      Events:
        BucketEvent1:
          Type: S3
          Properties:
            Bucket: !Ref DocumentosBucket
            Events:
              - s3:ObjectCreated:*
            Filter:
              S3Key:
                Rules:
                  - Name: suffix
                    Value: xml
  SolicitaDescargaFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/solicita_descarga/
      Handler: app.lambda_handler
      Runtime: python3.9
      Timeout: 30
      Policies:
        - S3ReadPolicy:
            BucketName: !Ref FirmasBucket
      Environment:
        Variables:
          POWERTOOLS_SERVICE_NAME: solicitadescarga
          FIRMAS_BUCKET_NAME: !Ref FirmasBucket
  VerificarDescargaFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/verificar_descarga/
      Handler: app.lambda_handler
      Runtime: python3.9
      Timeout: 30
      Architectures:
        - x86_64
      Policies:
        - S3ReadPolicy:
            BucketName: !Ref FirmasBucket
      Environment:
        Variables:
          POWERTOOLS_SERVICE_NAME: verificardescarga
          FIRMAS_BUCKET_NAME: !Ref FirmasBucket
  DescargarPaqueteFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/descargar_paquete/
      Handler: app.lambda_handler
      Runtime: python3.9
      Timeout: 30
      Architectures:
        - x86_64
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref FirmasBucket
        - S3CrudPolicy:
            BucketName: !Ref DescargasBucket
      Environment:
        Variables:
          POWERTOOLS_SERVICE_NAME: descargarpaquete
          FIRMAS_BUCKET_NAME: !Ref FirmasBucket
          DESCARGAS_BUCKET_NAME: !Ref DescargasBucket
  CfdiClientStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      DefinitionSubstitutions:
        SolicitaDescargaFunctionArn: !GetAtt SolicitaDescargaFunction.Arn
        VerificarDescargaFunctionArn: !GetAtt VerificarDescargaFunction.Arn
        DescargarPaqueteFunctionArn: !GetAtt DescargarPaqueteFunction.Arn
        EmpresaDBTable: !Ref EmpresaDBTable
      Policies:
        - LambdaInvokePolicy:
            FunctionName: !Ref SolicitaDescargaFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref VerificarDescargaFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref DescargarPaqueteFunction
        - DynamoDBWritePolicy:
            TableName: !Ref EmpresaDBTable
      DefinitionUri: statemachine/cfdiclient.asl.json
  PlanificadorFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/planificador/
      Handler: app.lambda_handler
      Runtime: python3.9
      Timeout: 30
      Architectures:
        - x86_64
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref EmpresaDBTable
        - StepFunctionsExecutionPolicy:
            StateMachineName: !GetAtt CfdiClientStateMachine.Name
      Environment:
        Variables:
          POWERTOOLS_SERVICE_NAME: planificador
          EMPRESA_TABLE_NAME: !Ref EmpresaDBTable
          CFDI_CLIENT_STATE_MACHINE_ARN: !Ref CfdiClientStateMachine
      Events:
        PlanificadorSchedule:
          Type: Schedule
          Properties:
            Schedule: rate(10 minutes)
            Enabled: true
Outputs:
  EmpresaDBTable:
    Value: !Ref EmpresaDBTable
  DocumentosDBTable:
    Value: !Ref DocumentosDBTable
  FirmasBucket:
    Value: !Ref FirmasBucket
  DescargasBucket:
    Value: !Ref DescargasBucket
  DocumentosBucket:
    Value: !Ref DocumentosBucket
  DescompresorFunction:
    Value: !Ref DescompresorFunction
  ExtractorFunction:
    Value: !Ref ExtractorFunction
  SolicitaDescargaFunction:
    Value: !Ref SolicitaDescargaFunction
  VerificarDescargaFunction:
    Value: !Ref VerificarDescargaFunction
  DescargarPaqueteFunction:
    Value: !Ref DescargarPaqueteFunction
  CfdiClientStateMachine:
    Value: !Ref CfdiClientStateMachine
  PlanificadorFunction:
    Value: !Ref PlanificadorFunction
